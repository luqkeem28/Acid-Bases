<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Acids & Bases Animation</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen&family=Space+Mono:wght@400;700&family=Pinyon+Script&display=swap">
<style>
/* Layout concept: retro-OS windows floating over a sky-and-field wallpaper. Pixel type for labels, mono for reading. */
:root{
  --ink:#10162f; --yellow:#fff200; --blue:#1a0fd6; --chrome:#cfcfd5; --glass:rgba(255,255,255,.82);
  --red:#d8231a; --o1:#ffb25c; --o2:#f2601a; --ok:#1f8a3b; --bad:#c4281c;
  --pixel:'Silkscreen','Courier New',monospace; --mono:'Space Mono','Courier New',monospace; --script:'Pinyon Script',cursive;
}
*{box-sizing:border-box}
html{color-scheme:light}
body{
  margin:0; min-height:100vh; color:var(--ink); font:15px/1.65 var(--mono);
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:28px 56px;
  background-color:#8fb6e2;
  background-image:
    radial-gradient(ellipse 16% 5% at 18% 12%,rgba(255,255,255,.9),transparent 72%),
    radial-gradient(ellipse 20% 6% at 80% 22%,rgba(255,255,255,.85),transparent 72%),
    radial-gradient(ellipse 14% 4% at 55% 40%,rgba(255,255,255,.7),transparent 72%),
    linear-gradient(180deg,#365f9f 0,#7fa9dc 36%,#cfe2f4 55%,#6c9a3a 55.2%,#3c7620 100%);
  background-attachment:fixed;
}
.wrap{max-width:1100px;margin:0 auto}
a{color:var(--blue)}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.px{font-family:var(--pixel)}
.win{background:var(--glass);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);border:2px solid #fff;border-radius:10px;box-shadow:0 6px 0 rgba(10,20,50,.3);overflow:hidden;min-width:0}
.bar{display:flex;align-items:center;gap:7px;padding:8px 12px;background:linear-gradient(#f6f6f8,#c8c8d0);border-bottom:1px solid #9a9aa6}
.bar i{width:14px;height:14px;border-radius:50%;border:1px solid rgba(0,0,0,.45);display:block;flex:none}
.bar i:nth-child(1){background:#e4281e}.bar i:nth-child(2){background:#f5c400}.bar i:nth-child(3){background:#25c02b}
.bar b{font:400 12px var(--pixel);letter-spacing:.06em;margin-left:8px;text-transform:uppercase;color:#3a3a4a}
.body{padding:18px 20px 22px}
.body h2{font:400 20px/1.3 var(--pixel);margin:0 0 10px;letter-spacing:.02em}
.body p{margin:0 0 12px}
.pill{display:inline-block;padding:9px 22px;border-radius:999px;border:2px solid #fff;background:linear-gradient(var(--o1),var(--o2));color:#2a1200;font:400 15px var(--pixel);text-decoration:none;box-shadow:0 4px 0 rgba(120,40,0,.55),inset 0 2px 0 rgba(255,255,255,.55);cursor:pointer;letter-spacing:.03em}
.pill:hover{filter:brightness(1.07)}
.pill:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(120,40,0,.55),inset 0 2px 0 rgba(255,255,255,.55)}
.pill[disabled]{opacity:.5;cursor:default;filter:grayscale(.4)}
.pill.alt{background:linear-gradient(#f4f4f6,#c3c3cc);color:var(--ink);box-shadow:0 4px 0 rgba(30,30,60,.45),inset 0 2px 0 #fff}
.title{margin:0;color:var(--yellow);text-shadow:3px 3px 0 #000,-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000;line-height:.95}
.back{display:inline-block;margin-bottom:18px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.wrap{max-width:900px}
.title{font-family:var(--pixel);font-size:clamp(2rem,6vw,3.4rem);margin-bottom:18px}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.tab{font:400 13px var(--pixel);padding:8px 14px;border:2px solid #000;background:var(--chrome);cursor:pointer;letter-spacing:.04em;box-shadow:3px 3px 0 #000}
.tab[aria-selected=true]{background:var(--blue);color:#fff}
.stage{display:block;width:100%;height:auto;background:#fffdf5;border:2px solid #000;border-radius:6px}
.stage .at{font:700 34px var(--mono);fill:#111;text-anchor:middle}
.stage .sm{font-size:26px}
.stage .dl{font:700 16px var(--mono);fill:#555;text-anchor:middle}
.stage .tag{font:400 12px var(--pixel);fill:#444}
.stage .b{stroke:#111;stroke-width:4;stroke-linecap:round;fill:none}
.stage .lp circle{fill:var(--blue);transition:fill .4s}
.stage .arrow{fill:none;stroke:var(--red);stroke-width:3.5;stroke-linecap:round;opacity:0;transition:opacity .8s}
.stage .chg{font:700 22px var(--mono);fill:var(--red);text-anchor:middle;opacity:0;transition:opacity .6s}
.stage .fade{transition:opacity .8s}
.stage .mv{transition:transform 1.4s cubic-bezier(.5,0,.2,1)}
.stage .late{opacity:0;transition:opacity .6s 1.1s}
.stage .empty{fill:none;stroke:#777;stroke-width:2.5;stroke-dasharray:6 5}
/* scene 1 */
.on1 .a1{opacity:1}.on1 .lp-use circle{fill:var(--red)}
.on2 .a2{opacity:1}
.on3 .hmv{transform:translate(-260px,-66px)}.on3 .clmv{transform:translate(48px,0)}
.on3 .oldb,.on3 .dl{opacity:0}.on3 .lp-use{opacity:0}.on3 .late,.on3 .chg{opacity:1;transition-delay:1.1s}
.on3 .arrow{opacity:.3}
/* scene 2 */
#sc2.on1 .a1{opacity:1}
#sc2.on2 .wmv{transform:translate(-250px,0)}#sc2.on2 .empty{opacity:0}#sc2.on2 .lp-use{opacity:0}
#sc2.on2 .arrow{opacity:.3}#sc2.on2 .late,#sc2.on2 .chg{opacity:1;transition-delay:1.1s}
.cap{margin:14px 0 4px;padding:12px 16px;background:#fff;border:2px solid #000;min-height:3.6em;font-weight:700}
.ctrl{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:12px}
.ctrl .lbl{font:400 13px var(--pixel);color:#222;margin-left:auto}
.leg{display:flex;flex-wrap:wrap;gap:6px 18px;margin:12px 0 0;font-size:13px}
.leg span:before{content:"";display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:-1px;background:var(--blue)}
.leg span.r:before{background:var(--red)}
.sel{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin-bottom:12px}
.sel label{display:grid;gap:4px;font:400 12px var(--pixel);letter-spacing:.05em}
.sel select{font:700 14px var(--mono);padding:8px;border:2px solid #000;background:#fff;color:var(--ink);border-radius:0}
#beam{transition:transform .9s cubic-bezier(.4,1.4,.5,1)}
.pan{transition:transform .9s cubic-bezier(.4,1.4,.5,1)}
.eq{font:700 18px var(--mono);margin:12px 0 4px;text-align:center}
.verdict{background:#fff;border:2px solid #000;padding:12px 16px;margin-top:8px}
.verdict b{background:var(--yellow);padding:0 4px}
</style>
</head>
<body>
<main class="wrap">
    <h1 class="title">Animation.exe</h1>

  <div class="tabs" role="tablist" aria-label="Animations">
    <button class="tab" role="tab" id="t-s1" aria-selected="true" aria-controls="p-s1" data-s="s1">1 · Proton transfer</button>
    <button class="tab" role="tab" id="t-s2" aria-selected="false" aria-controls="p-s2" data-s="s2">2 · Lewis acid–base</button>
    <button class="tab" role="tab" id="t-s3" aria-selected="false" aria-controls="p-s3" data-s="s3">3 · pKa balance</button>
  </div>

  <section class="win">
    <div class="bar"><i></i><i></i><i></i><b id="wt">proton_transfer.mov</b></div>
    <div class="body">

      <div id="p-s1" role="tabpanel" aria-labelledby="t-s1">
        <svg id="sc1" class="stage" viewBox="0 0 700 300" role="img" aria-label="Water uses a lone pair to take a proton from HCl, giving H3O+ and Cl-">
          <defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#d8231a"/></marker></defs>
          <text class="tag" x="24" y="34">BASE · H₂O</text><text class="tag" x="400" y="34">ACID · HCl</text>
          <!-- water -->
          <line class="b" x1="128" y1="196" x2="100" y2="232"/><line class="b" x1="156" y1="196" x2="184" y2="232"/>
          <text class="at" x="140" y="186">O</text>
          <text class="at sm" x="92" y="262">H</text><text class="at sm" x="192" y="262">H</text>
          <g class="lp lp-use fade"><circle cx="130" cy="148" r="4.5"/><circle cx="150" cy="148" r="4.5"/></g>
          <g class="lp"><circle cx="174" cy="168" r="4.5"/><circle cx="174" cy="182" r="4.5"/></g>
          <text class="chg" x="176" y="146">+</text>
          <line class="b late" x1="140" y1="130" x2="140" y2="156"/>
          <!-- HCl -->
          <line class="b oldb fade" x1="420" y1="175" x2="486" y2="175"/>
          <g class="mv hmv"><text class="at sm" x="400" y="186">H</text></g>
          <g class="mv clmv"><text class="at" x="520" y="186">Cl</text><text class="chg" x="548" y="152">−</text></g>
          <text class="dl" x="400" y="150">δ+</text><text class="dl" x="520" y="150">δ−</text>
          <path class="arrow a1" d="M140 140 C150 40, 330 40, 394 158" marker-end="url(#ah)"/>
          <path class="arrow a2" d="M452 170 C468 118, 500 118, 514 150" marker-end="url(#ah)"/>
          <text class="tag late" x="24" y="288" style="fill:#1a0fd6">H₃O⁺ = CONJUGATE ACID</text>
          <text class="tag late" x="470" y="288" style="fill:#1a0fd6">Cl⁻ = CONJUGATE BASE</text>
        </svg>
        <div class="leg"><span class="r">lone pair in use</span><span>other lone pair</span></div>
      </div>

      <div id="p-s2" role="tabpanel" aria-labelledby="t-s2" hidden>
        <svg id="sc2" class="stage" viewBox="0 0 700 300" role="img" aria-label="Water donates a lone pair to the empty orbital on boron in BF3">
          <text class="tag" x="24" y="34">LEWIS ACID · BF₃</text><text class="tag" x="440" y="34">LEWIS BASE · H₂O</text>
          <!-- BF3 -->
          <line class="b" x1="180" y1="104" x2="180" y2="158"/><line class="b" x1="114" y1="234" x2="166" y2="192"/><line class="b" x1="246" y1="234" x2="194" y2="192"/>
          <text class="at" x="180" y="186">B</text>
          <text class="at sm" x="180" y="96">F</text><text class="at sm" x="100" y="262">F</text><text class="at sm" x="260" y="262">F</text>
          <ellipse class="empty fade" cx="236" cy="173" rx="26" ry="15"/>
          <text class="dl fade empty-l" x="236" y="215">empty orbital</text>
          <text class="chg" x="212" y="150">−</text>
          <line class="b late" x1="200" y1="173" x2="254" y2="173"/>
          <!-- water -->
          <g class="mv wmv">
            <line class="b" x1="508" y1="196" x2="488" y2="232"/><line class="b" x1="532" y1="196" x2="552" y2="232"/>
            <text class="at" x="520" y="186">O</text>
            <text class="at sm" x="480" y="262">H</text><text class="at sm" x="560" y="262">H</text>
            <g class="lp lp-use fade"><circle cx="490" cy="164" r="4.5"/><circle cx="490" cy="180" r="4.5"/></g>
            <g class="lp"><circle cx="548" cy="166" r="4.5"/><circle cx="548" cy="180" r="4.5"/></g>
            <text class="chg" x="552" y="148">+</text>
          </g>
          <path class="arrow a1" d="M488 156 C450 70, 300 70, 224 160" marker-end="url(#ah)"/>
        </svg>
        <div class="leg"><span class="r">lone pair in use</span><span>other lone pair</span></div>
      </div>

      <div id="steps">
        <div class="cap" id="cap" aria-live="polite"></div>
        <div class="ctrl">
          <button class="pill alt" id="back">◀ Back</button>
          <button class="pill" id="next">Next ▶</button>
          <button class="pill alt" id="play">Play</button>
          <button class="pill alt" id="rst">Reset</button>
          <span class="lbl" id="stl"></span>
        </div>
      </div>

      <div id="p-s3" role="tabpanel" aria-labelledby="t-s3" hidden>
        <div class="sel">
          <label for="acid">Acid, HA<select id="acid"></select></label>
          <label for="hb">Base takes H⁺ and becomes HB<select id="hb"></select></label>
        </div>
        <svg id="bal" class="stage" viewBox="0 0 700 270" role="img" aria-label="Balance showing which side of the equilibrium is favoured">
          <polygon points="350,150 318,238 382,238" fill="#555" stroke="#000" stroke-width="3"/>
          <rect x="290" y="238" width="120" height="12" fill="#222"/>
          <g id="beam"><line x1="120" y1="150" x2="580" y2="150" stroke="#000" stroke-width="8" stroke-linecap="round"/><circle cx="350" cy="150" r="9" fill="#ffe94a" stroke="#000" stroke-width="3"/></g>
          <g class="pan" id="pl"><line x1="120" y1="150" x2="120" y2="172" stroke="#000" stroke-width="3"/><rect x="40" y="172" width="160" height="46" fill="#fff" stroke="#000" stroke-width="3"/><text class="tag" x="120" y="201" text-anchor="middle">REACTANTS</text></g>
          <g class="pan" id="pr"><line x1="580" y1="150" x2="580" y2="172" stroke="#000" stroke-width="3"/><rect x="500" y="172" width="160" height="46" fill="#fff" stroke="#000" stroke-width="3"/><text class="tag" x="580" y="201" text-anchor="middle">PRODUCTS</text></g>
        </svg>
        <div class="eq" id="eq"></div>
        <div class="verdict" id="vd" aria-live="polite"></div>
      </div>

    </div>
  </section>
</main>
<script>
var S={
 s1:{title:'proton_transfer.mov',steps:[
  'Start: water is the base (it has lone pairs). HCl is the acid, with a polarized H–Cl bond: δ+ on H, δ− on Cl.',
  'Curved arrow 1 starts at a lone pair on O and points to the H. The O is about to form a new O–H bond.',
  'Curved arrow 2 starts at the H–Cl bond and points to Cl. The bonding electrons move onto Cl, so the bond breaks.',
  'Done: the proton has moved. H₃O⁺ is the conjugate acid of water. Cl⁻ is the conjugate base of HCl.']},
 s2:{title:'lewis_acid_base.mov',steps:[
  'Start: BF₃ has only six electrons around B, so it has an empty orbital. It is a Lewis acid only. H₂O has lone pairs: a Lewis base.',
  'Curved arrow: the lone pair on O is donated toward the electron-poor B.',
  'A new B–O bond forms. No bond had to break. B ends up with a negative formal charge and O with a positive one.']}
};
var cur='s1',step=0,timer=null;
var cap=document.getElementById('cap'),back=document.getElementById('back'),next=document.getElementById('next'),play=document.getElementById('play'),stl=document.getElementById('stl');
function stop(){if(timer){clearInterval(timer);timer=null}play.textContent='Play'}
function render(){
  var sc=S[cur];if(!sc)return;
  var svg=document.getElementById(cur==='s1'?'sc1':'sc2');
  for(var i=1;i<=3;i++)svg.classList.toggle('on'+i,step>=i);
  cap.textContent=sc.steps[step];stl.textContent='STEP '+(step+1)+' / '+sc.steps.length;
  back.disabled=step===0;next.disabled=step===sc.steps.length-1;
}
function go(d){step=Math.max(0,Math.min(S[cur].steps.length-1,step+d));render()}
back.onclick=function(){stop();go(-1)};
next.onclick=function(){stop();go(1)};
document.getElementById('rst').onclick=function(){stop();step=0;render()};
play.onclick=function(){
  if(timer){stop();return}
  if(step===S[cur].steps.length-1){step=0;render()}
  play.textContent='Pause';
  timer=setInterval(function(){if(step>=S[cur].steps.length-1){stop();return}go(1)},2400);
};
document.querySelectorAll('.tab').forEach(function(t){
  t.onclick=function(){
    stop();cur=t.dataset.s;step=0;
    document.querySelectorAll('.tab').forEach(function(x){x.setAttribute('aria-selected',x===t)});
    ['s1','s2','s3'].forEach(function(k){document.getElementById('p-'+k).hidden=k!==cur});
    document.getElementById('steps').hidden=cur==='s3';
    document.getElementById('wt').textContent=cur==='s3'?'pka_balance.mov':S[cur].title;
    if(cur!=='s3')render();else bal();
  };
});
/* pKa balance */
var SP=[
 {n:'HCl',p:-7,c:'Cl⁻'},{n:'CH₃COOH',p:4.8,c:'CH₃COO⁻'},{n:'H₂O',p:15.7,c:'HO⁻'},{n:'CH₃CH₂OH',p:16,c:'CH₃CH₂O⁻'},
 {n:'HC≡CH',p:25,c:'HC≡C⁻'},{n:'NH₃',p:38,c:'H₂N⁻'},{n:'CH₂=CH₂',p:44,c:'CH₂=CH⁻'},{n:'CH₃CH₃',p:50,c:'CH₃CH₂⁻'}
];
var acid=document.getElementById('acid'),hb=document.getElementById('hb');
SP.forEach(function(s,i){
  [acid,hb].forEach(function(sel){var o=document.createElement('option');o.value=i;o.textContent=s.n+'  (pKa '+s.p+')';sel.appendChild(o)});
});
acid.value=4;hb.value=5;
function bal(){
  var A=SP[+acid.value],B=SP[+hb.value],d=B.p-A.p;
  document.getElementById('eq').innerHTML=A.n+' + '+B.c+' ⇌ '+A.c+' + '+B.n;
  var th=Math.max(-18,Math.min(18,d*1.1));
  document.getElementById('beam').style.transform='rotate('+th+'deg)';
  document.getElementById('beam').style.transformOrigin='350px 150px';
  var dy=230*Math.sin(th*Math.PI/180);
  document.getElementById('pr').style.transform='translateY('+dy+'px)';
  document.getElementById('pl').style.transform='translateY('+(-dy)+'px)';
  var v;
  var k=Math.abs(d)<0.05?'1':'10<sup>'+(Math.round(d*10)/10)+'</sup>';
  if(Math.abs(d)<0.05)v='Both acids have the same pKa, so neither side is favoured. <b>K ≈ 1</b>.';
  else if(d>0)v='The starting acid <b>'+A.n+'</b> (pKa '+A.p+') is stronger than <b>'+B.n+'</b> (pKa '+B.p+'). Equilibrium favours the <b>products</b>. K ≈ '+k+'.';
  else v='The starting acid <b>'+A.n+'</b> (pKa '+A.p+') is weaker than <b>'+B.n+'</b> (pKa '+B.p+'). Equilibrium favours the <b>reactants</b>. K ≈ '+k+'.';
  document.getElementById('vd').innerHTML=v+'<br><small>Rule: equilibrium favours the weaker acid, the one with the higher pKa.</small>';
}
acid.onchange=bal;hb.onchange=bal;
render();bal();
</script>
</body>
</html>

</body></html>
